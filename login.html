<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Jonathan Victor</title>

    <link rel="stylesheet" href="css/output.css">
    <link rel="shortcut icon" href="assets/favicons/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body class="selection:bg-accent selection:text-white bg-background text-text-primary">

    <header class="fixed top-0 left-0 w-full z-50 bg-background/80 backdrop-blur-md border-b border-border/60">
        <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="index.html" class="text-xl font-extrabold tracking-tight flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-accent"></span>
                <span>Jonathanvictor<span class="text-accent font-medium">-dev</span></span>
            </a>
            <nav class="hidden md:flex items-center gap-6 text-sm font-medium">
                <a href="index.html" class="text-text-secondary hover:text-accent transition-colors">Início</a>
                <a href="index.html#contato"
                    class="px-4 py-2 bg-accent/10 border border-accent/30 text-accent-light rounded-lg text-xs hover:bg-accent hover:text-white transition-all">Fale
                    Comigo</a>
            </nav>
        </div>
    </header>

    <main class="flex items-center justify-center px-6" style="min-height: calc(100vh - 64px);">
        <section class="w-full">
            <div class="bg-surface border border-border rounded-2xl p-8 shadow-lg max-w-xl mx-auto w-full">
                <header class="mb-6 text-center">
                    <h1 class="text-2xl font-black text-text-primary uppercase">Painel administrativo</h1>
                </header>

                <form action="#" method="post" class="space-y-4" novalidate>
                    <div>
                        <label for="email" class="text-sm font-medium text-text-primary">Email</label>
                        <input id="email" name="email" type="email" required
                            class="mt-2 w-full px-4 py-3 rounded-lg bg-background border border-border text-text-primary placeholder:text-text-secondary focus:outline-none focus:ring-2 focus:ring-accent/40"
                            placeholder="seu@exemplo.com" aria-describedby="email-help">
                    </div>

                    <div>
                        <label for="password" class="text-sm font-medium text-text-primary">Senha</label>
                        <input id="password" name="password" type="password" required
                            class="mt-2 w-full px-4 py-3 rounded-lg bg-background border border-border text-text-primary placeholder:text-text-secondary focus:outline-none focus:ring-2 focus:ring-accent/40"
                            placeholder="••••••••">
                    </div>

                    <div class="flex items-center justify-between">
                        <label class="inline-flex items-center gap-2 text-sm text-text-secondary">
                            <input type="checkbox" name="remember"
                                class="w-4 h-4 text-accent focus:ring-accent/40 rounded" />
                            Lembrar-me
                        </label>
                    </div>

                    <div>
                        <button type="submit"
                            class="w-full px-4 py-3 bg-accent hover:bg-accent-light text-white font-medium rounded-xl shadow-md shadow-accent/20 transition-all">Entrar</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script src="js/main.js" defer></script>
</body>

</html>
